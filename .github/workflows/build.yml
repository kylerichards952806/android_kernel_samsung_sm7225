name: Build kernel (a42xq)

on:
  push:
    branches: [ lineage-20.0 ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Image + AnyKernel3 zip (${{ matrix.variant }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [normal, enforcing]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl flex git \
            gcc-aarch64-linux-gnu libelf-dev libssl-dev python3 rsync unzip zip

      - name: Set up clang r416183b
        run: |
          mkdir -p "$RUNNER_TEMP/toolchain"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/clang.tar.gz" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r21/clang-r416183b.tar.gz"
          tar -xzf "$RUNNER_TEMP/clang.tar.gz" -C "$RUNNER_TEMP/toolchain"
          echo "$RUNNER_TEMP/toolchain/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/toolchain/bin/clang" --version

      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LLVM=1 LLVM_IAS=1 \
            vendor/a42xq_eur_open_defconfig

      - name: Apply SELinux enforcing variant
        if: matrix.variant == 'enforcing'
        run: |
          scripts/config --file out/.config -e SECURITY_SELINUX_BOOTPARAM
          scripts/config --file out/.config --set-val SECURITY_SELINUX_BOOTPARAM_VALUE 1
          sed -i 's|^CONFIG_LOCALVERSION="\(.*\)"|CONFIG_LOCALVERSION="\1-enforcing"|' out/.config
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LLVM=1 LLVM_IAS=1 \
            olddefconfig
          grep -E "^CONFIG_SECURITY_SELINUX(_BOOTPARAM|_BOOTPARAM_VALUE)?=|^CONFIG_LOCALVERSION=" out/.config
          grep -q '^CONFIG_LOCALVERSION=".*-enforcing"$' out/.config

      - name: Verify KernelSU-Next config
        run: |
          grep -E "^CONFIG_KSU=|^CONFIG_KSU_.*=y" out/.config

      - name: Build kernel Image
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LLVM=1 LLVM_IAS=1 \
            -j"$(nproc)" Image

      - name: Package AnyKernel3 zip
        run: |
          test -f out/arch/arm64/boot/Image
          suffix=""
          if [ "${{ matrix.variant }}" = "enforcing" ]; then suffix="-enforcing"; fi
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git "$RUNNER_TEMP/ak3"
          git -C "$RUNNER_TEMP/ak3" checkout 41f04bdb4ee3
          cp anykernel/anykernel.sh "$RUNNER_TEMP/ak3/anykernel.sh"
          cp out/arch/arm64/boot/Image "$RUNNER_TEMP/ak3/Image"
          mkdir -p "$RUNNER_TEMP/out"
          ( cd "$RUNNER_TEMP/ak3" && \
            zip -r9 "$RUNNER_TEMP/out/a42xq-KernelSU-Next-${{ github.run_number }}${suffix}.zip" . -x ".git/*" )
          ls -l "$RUNNER_TEMP/out"

      - name: Upload TWRP flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: a42xq-KernelSU-Next-${{ github.run_number }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/out/*.zip
          if-no-files-found: error
